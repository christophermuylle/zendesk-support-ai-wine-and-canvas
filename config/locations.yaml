# ---------------------------------------------------------------------------
# Managed locations - Wine and Canvas
# ---------------------------------------------------------------------------
# Checked top to bottom against the ticket subject + latest customer
# message; first match wins. Each location's pricing/booking/venue details
# live in their own file under config/knowledge-base/locations/<file>,
# combined with config/knowledge-base/shared.md when the AI drafts a reply.
#
# This is separate from (and runs after) the out_of_scope_location rule in
# rules.yaml, which already filters out the self-managed locations
# (Las Vegas, Toledo, Columbus, South Bend, Rochester, Minneapolis,
# Bloomington) before a ticket ever reaches here.
#
# NOTE: sourced from https://wineandcanvas.com/locations/ and each
# location's own page - confirm these are current and complete.
#
# FLAGGED FOR YOU:
#  - "Fort Lauderdale / Miami, FL" - RESOLVED via the team's actual Zendesk
#    macros (pulled 2026-09-09): it shows up consistently in the private-
#    event pricing tiers, restaurant lists, and promo emails alongside
#    Tampa/Fort Myers/Indianapolis, so it's kept here as a normal managed
#    location. Note Miami itself prices like Orlando/Naples, not like Fort
#    Lauderdale - see fort-lauderdale.md.
#  - "Cadillac, MI" - confirmed via macros to be a normal private-events
#    market (same pricing tier as Tampa/Fort Myers/Indianapolis/Fort
#    Lauderdale); it just doesn't appear to have its own public event
#    calendar page. Kept here as-is.
#  - "Adrian, MI" appears in the contact form's location dropdown but
#    doesn't show up on the current locations page at all, and no page was
#    found for it, and it didn't appear anywhere in the team's macros
#    either - may no longer be active. Let me know if you handle support
#    for it and I'll add it.
# ---------------------------------------------------------------------------

locations:
  - slug: fort-myers
    display_name: "Fort Myers / Cape Coral / Naples, FL"
    file: fort-myers.md
    # "bonita springs" added 2026-09-21 - the private-event corporate/
    # standard templates group "Naples/Bonita Springs" together for
    # pricing (see src/private-event-quotes.ts), so a ticket that only
    # says "Bonita Springs" needs to resolve to this location too.
    match_keywords: ["fort myers", "ft myers", "cape coral", "naples", "bonita springs"]

  - slug: tampa
    display_name: "Tampa / St. Pete / Clearwater, FL"
    file: tampa.md
    match_keywords: ["tampa", "st. pete", "st pete", "st. petersburg", "st petersburg", "saint petersburg", "clearwater"]

  - slug: orlando
    display_name: "Orlando, FL"
    file: orlando.md
    match_keywords: ["orlando"]

  - slug: fort-lauderdale
    display_name: "Fort Lauderdale / Miami, FL"
    file: fort-lauderdale.md
    # South Florida towns, split between the two pricing keys by proximity
    # (Christopher, 2026-10-01: "Split these between Fort Lauderdale and
    # MIAMI. Which ever they are closer to."). Both sets match THIS slug so
    # the ticket resolves to a location at all; which PRICE they get is
    # decided by MIAMI_DADE_KEYWORDS in src/private-event-quotes.ts, since
    # Miami is Group B ($45/$50) and Fort Lauderdale is Group A ($39/$44).
    #
    # "sunrise" is deliberately state-qualified: on its own it is far too
    # common in painting titles and event copy to use as a location match.
    # A ticket saying only "Sunrise" therefore goes to a human rather than
    # being matched or mis-priced.
    match_keywords: ["fort lauderdale", "ft lauderdale", "ft. lauderdale",
      # Broward -> Fort Lauderdale pricing
      "hollywood", "pembroke pines", "pembroke park", "coral springs", "miramar", "pompano beach",
      "davie", "plantation, fl", "plantation fl", "sunrise, fl", "sunrise fl", "deerfield beach",
      "lauderhill", "lauderdale lakes", "lauderdale-by-the-sea", "weston, fl", "weston fl",
      "tamarac", "margate", "coconut creek", "oakland park", "hallandale", "north lauderdale",
      "dania beach", "cooper city", "parkland, fl", "parkland fl", "wilton manors",
      "lighthouse point", "southwest ranches", "west park, fl", "hillsboro beach",
      # Palm Beach County, added 2026-10-01 on Christopher's say-so - these
      # are the first two cities north of Broward to be covered. "delray" and
      # "boca" are how locals actually write them, so both short forms are
      # here; bare "boca" is not, since on its own it is too thin a match.
      "boca raton", "boca, fl", "boca fl", "delray beach", "delray",
      # Miami-Dade -> Miami pricing
      "miami", "kendall", "homestead", "doral", "palmetto bay", "pinecrest", "coral gables",
      "hialeah", "cutler bay", "cutler ridge", "richmond heights", "naranja", "florida city",
      "brickell", "aventura", "key biscayne", "sweetwater, fl", "opa-locka", "opa locka"]

  - slug: indianapolis
    display_name: "Indianapolis, IN"
    file: indianapolis.md
    # Christopher's Indianapolis territory, 2026-10-01, added to the
    # suburbs already here (Greenwood, Avon and Plainfield were not on his
    # list but are served - the approved clarifier copy names Greenwood).
    #
    # EVERY qualified entry now carries BOTH the comma and comma-less form.
    # Only "x, in" existed before, which meant a real ticket reading
    # "Westfield indiana" matched nothing at all: withStateAbbreviations
    # turns that into "westfield in", with no comma, so the keyword could
    # never fire. All seven original suburbs had this bug.
    #
    # Qualified rather than bare, deliberately: "anderson", "pendleton" and
    # "greenwood" are surnames and the form body contains the customer's own
    # name, so a bare "anderson" would send every Sarah Anderson in the
    # country to Indianapolis. "avon" is a cosmetics brand, "fishers" is a
    # plural noun, "westfield" is a shopping centre, "plainfield" exists in
    # several states.
    match_keywords: ["indianapolis", "zionsville", "whitestown", "noblesville", "crawfordsville",
      "lebanon, in", "lebanon in", "carmel, in", "carmel in",
      "fishers, in", "fishers in", "westfield, in", "westfield in",
      "anderson, in", "anderson in", "pendleton, in", "pendleton in",
      "greenwood, in", "greenwood in", "avon, in", "avon in",
      "plainfield, in", "plainfield in",
      # Southside Indianapolis territory (Christopher, 2026-10-01). He
      # confirmed we keep quoting these at Indianapolis rates rather than
      # handing them to that licensee, so Greenwood, Avon and Plainfield -
      # already above - stay put.
      #
      # "franklin", "lawrence" and "cumberland" are state-qualified: the first
      # two are among the commonest personal names in the country and the form
      # body carries the customer's own name, and Cumberland is far better
      # known in Maryland. Bargersville, Monrovia, Brownsburg and New
      # Palestine are distinctive enough bare.
      "bargersville", "monrovia", "brownsburg", "new palestine",
      "franklin, in", "franklin in", "lawrence, in", "lawrence in",
      "cumberland, in", "cumberland in"]

  - slug: grand-rapids
    display_name: "Grand Rapids, MI"
    file: grand-rapids.md
    # Christopher's Grand Rapids territory, 2026-10-02: Grand Rapids & North,
    # Muskegon & Surrounding, and the Spring Lake / Grand Haven / Lakeshore
    # group, plus Shelby, Hart and Pentwater from his unassigned "Inland /
    # Northern Expansion" list - those three sit up the lakeshore from
    # Muskegon, which is Grand Rapids territory. The rest of that group went
    # to Cadillac.
    #
    # East Grand Rapids, North Muskegon and Muskegon Heights need no entry of
    # their own: they contain "grand rapids" and "muskegon", which now match
    # as whole tokens.
    #
    # 18 names are state-qualified. Bare, each is a word before it is a town:
    # "walker", "grant", "hart" and "lowell" are verbs or surnames and the form
    # body carries the customer's own name; "white cloud" and "spring lake"
    # read as painting titles; "wyoming" is a state; "holland" a country;
    # "douglas", "shelby" and "baldwin" are first names; "sparta",
    # "whitehall", "rockford", "greenville" and "hastings" are better known
    # elsewhere.
    #
    # Paw Paw and Hastings are nearer Kalamazoo and Lansing, both of which are
    # excluded - but Christopher placed them here, and grand-rapids is matched
    # BEFORE kalamazoo and lansing in this file. That ordering is load-bearing.
    match_keywords: [
      "grand rapids", "byron center", "caledonia", "kentwood", "grandville", "grand haven",
      "cedar springs", "newaygo", "hudsonville", "allendale", "saugatuck", "middleville", "wayland",
      "zeeland", "paw paw", "jenison", "coopersville", "belding", "comstock park", "muskegon",
      "norton shores", "roosevelt park", "fruitport", "montague", "ravenna", "holton", "twin lake",
      "hesperia", "ferrysburg", "west olive", "south haven", "pentwater", "ada, mi", "ada mi",
      "wyoming, mi", "wyoming mi", "holland, mi", "holland mi", "rockford, mi", "rockford mi",
      "greenville, mi", "greenville mi", "hopkins, mi", "hopkins mi", "hastings, mi", "hastings mi",
      "fremont, mi", "fremont mi", "walker, mi", "walker mi", "lowell, mi", "lowell mi", "sparta, mi",
      "sparta mi", "whitehall, mi", "whitehall mi", "white cloud, mi", "white cloud mi", "grant, mi",
      "grant mi", "spring lake, mi", "spring lake mi", "douglas, mi", "douglas mi", "hart, mi",
      "hart mi", "shelby, mi", "shelby mi"
    ]

  - slug: kalamazoo
    display_name: "Kalamazoo, MI"
    file: kalamazoo.md
    match_keywords: ["kalamazoo", "battle creek", "mattawan", "otsego", "coldwater"]

  - slug: lansing
    display_name: "Lansing / Jackson, MI"
    file: lansing.md
    match_keywords: ["lansing", "jackson, mi", "okemos", "owosso"]

  - slug: cadillac
    display_name: "Cadillac, MI"
    file: cadillac.md
    # Christopher's Cadillac & North list, 2026-10-02, plus the northern half
    # of his unassigned "Inland / Northern Expansion" group - Big Rapids,
    # Reed City, Evart, Baldwin, Ludington, Scottville, Manistee and Onekama
    # are all nearer Cadillac than Grand Rapids.
    #
    # "lake city", "marion" and "baldwin" take the state: there is a Lake City
    # in Florida and a Marion in Indiana, both of which this brand serves, and
    # Baldwin is a common surname. Tustin stays bare here - Tustin, CA belongs
    # to Painting and Vino, which is a separate config, so the two cannot
    # collide.
    #
    # Cadillac is the one market carrying an explicit travel fee, which
    # matters now that Traverse City and Manistee are in range.
    match_keywords: [
      "cadillac", "manton", "mcbain", "mesick", "traverse city", "kingsley", "kalkaska", "big rapids",
      "reed city", "evart", "ludington", "scottville", "manistee", "onekama", "tustin",
      "lake city, mi", "lake city mi", "marion, mi", "marion mi", "baldwin, mi", "baldwin mi"
    ]
