# ---------------------------------------------------------------------------
# Support automation rules
# ---------------------------------------------------------------------------
# Rules are checked TOP TO BOTTOM against the latest customer message in the
# ticket. The first rule that matches wins - order matters, put your most
# specific / highest-priority rules first (e.g. "angry customer" before a
# generic FAQ catch-all).
#
# match:
#   any_keywords     - fires if the message contains ANY of these (case-insensitive)
#   all_keywords     - fires only if the message contains ALL of these
#   tags             - fires if the ticket already has any of these Zendesk tags
#
# action: solve | pending | escalate | no_action | order_confirmation
#   solve               - AI answers the question and the ticket is marked Solved
#   pending             - AI replies (usually asking for info) and ticket goes to
#                         Pending, i.e. "waiting on the customer"
#   escalate            - ticket is left Open, tagged, and ALWAYS held for a human -
#                         even in auto mode. Use this for anything with money, legal,
#                         or brand-reputation risk.
#   no_action           - completely hands off: no AI call, no reply, no status
#                         change. Only tags are applied (if set). Use this for
#                         tickets that are out of scope entirely - e.g. locations
#                         you don't provide support for.
#   order_confirmation  - for automated "New order" notification tickets, not a
#                         real support question: no AI call, no reply of any
#                         kind (draft or auto mode). Sets the "Reason for
#                         Customer Contacting Us" field (which also
#                         auto-applies the matching tag) and a status, by
#                         these three cases (Christopher, 2026-09-24):
#                           - total $0 or unparseable -> Order Confirmation,
#                             left Open for a human to check by hand
#                           - ordinary seat purchase  -> Order Confirmation,
#                             Solved and then Closed
#                           - private-event deposit   -> Private Event Deposit
#                             (first payment for that event) or Private Event
#                             Final Balance (any later one), left Pending
#                             because money is still outstanding
#                         A private-event payment is identified by a PRODUCT
#                         line named "Deposit ..." - NOT by the word "private"
#                         appearing in the ticket. See findDepositLineItem in
#                         src/util.ts for the live-ticket evidence behind that
#                         choice, and src/pipeline.ts's order_confirmation
#                         branch for the implementation.
#
#   newsletter_signup  - for "<Brand> - <City> Newsletter Sign Up" tickets
#                         (any city), also not a real support question: no
#                         AI call, no reply of any kind. Sets the "Reason
#                         for Customer Contacting Us" field to Newsletter
#                         Sign up, then Solves the ticket and immediately
#                         Closes it. See src/pipeline.ts's newsletter_signup
#                         branch.
#
# force_human_review: true means this rule NEVER auto-sends, regardless of MODE.
# add_tags: tags to stamp on the ticket when this rule fires (for reporting).
# drafting_hint: extra instruction passed to the AI when it writes the reply.
#
# Matching runs against the ticket SUBJECT plus the latest customer message,
# so a location that only shows up in the subject line (e.g. from a
# location-specific contact form) is still caught.
#
# SCOPE (Christopher, 2026-09-13): only draft AI replies for Private Event
# inquiries (event_booking_question) and ticket/order confirmations
# (new_order_confirmation). Everything else below is set to no_action -
# tagged and left Open for a human, no AI call, no reply of any kind - even
# though several of these rules used to draft. Same change applied to the
# Painting and Vino deployment's rules.yaml. Do not add solve/pending/
# escalate actions outside those two categories without Christopher
# explicitly asking again.
#
# Christopher, 2026-09-20: added newsletter_signup as another exception -
# purely mechanical (like order_confirmation, no AI call/reply ever). See
# the newsletter_signup_ticket rule below.
# ---------------------------------------------------------------------------

rules:
  # Automated "New order" notification tickets from the storefront - these
  # are order receipts Zendesk turns into tickets, not a real customer
  # question, so this is matched FIRST, ahead of the out-of-scope location
  # check (Christopher's rule, same as Painting and Vino: "Tickets
  # with 'New order' in the subject line or in the description should be
  # set to 'Order Confirmation' and status set to 'solved' only if the
  # order total is greater than $0. If it is $0 leave it open... to
  # handle." - no AI reply draft). See action doc above.
  #
  # Christopher, 2026-09-24: MOVED to the top of the list, above
  # out_of_scope_location. Order #180710 was a real storefront order that
  # named an excluded city (Lansing, MI) in the body, so
  # out_of_scope_location matched first and the ticket was never
  # recognised as an order at all - no "Reason for Customer Contacting
  # Us" field, no solve. Order receipts are mechanical (no AI call, no
  # reply of any kind), so running them before the location check cannot
  # "respond to" an excluded city's ticket - it only files the receipt.
  - name: new_order_confirmation
    match:
      any_keywords: ["new order"]
    action: order_confirmation
    force_human_review: false

  # "<Brand> - <City> Newsletter Sign Up" tickets from each city's newsletter
  # signup form (e.g. https://wineandcanvas.com/indianapolis) - confirmed
  # against a real ticket (#29078, Christopher, 2026-09-20): subject reads
  # "Wine and Canvas - Indianapolis Newsletter Sign Up", and the correct
  # "Reason for Customer Contacting Us" option is "Newsletter Sign up".
  # Applies to every city, not just Indianapolis ("Every city" - Christopher,
  # 2026-09-20). Matches on subject text so the city name doesn't matter.
  #
  # Christopher, 2026-09-24: MOVED above out_of_scope_location, same as
  # new_order_confirmation just above ("newsletter_signup_ticket - all
  # within scope"). Newsletter signups are in scope for EVERY city
  # including the excluded ones, so an excluded city's name appearing
  # anywhere in the ticket must not hijack this rule the way it hijacked
  # order #180710. Like order_confirmation this is mechanical - no AI
  # call, no reply of any kind - so running it ahead of the location
  # check cannot "respond to" an excluded city's ticket.
  #
  # SCOPE LIMIT (Christopher, 2026-09-24: "only for this unless told
  # otherwise"): new_order_confirmation and newsletter_signup_ticket are
  # the ONLY rules that belong above out_of_scope_location. Do not move
  # any other rule up without Christopher explicitly asking.
  - name: newsletter_signup_ticket
    match:
      any_keywords: ["newsletter sign up", "newsletter signup"]
    action: newsletter_signup
    force_human_review: false

  # Wine and Canvas locations that run their OWN customer support - never
  # respond to, tag, or touch tickets for these. Bonnie/Amber only handle a
  # subset of locations; everything else stays hands-off.
  #
  # Source: the location dropdown on https://wineandcanvas.com/contact-us/
  # and each subsite's own contact form (titled with its location). This
  # assumes the location the customer selected/the subsite name shows up in
  # the ticket subject or body - confirm that's actually true by checking a
  # real ticket once this is live, and adjust the phrases below if the
  # wording differs.
  #
  # TODO Christopher: you listed "Las Vegas, NV" - the dropdown also has a
  # separate "Henderson, NV" option (Vegas metro area). Should that be
  # excluded too? Included below for now - remove it if Henderson is one you
  # DO handle.
  - name: out_of_scope_location
    match:
      any_keywords:
        - "columbus, oh"
        - "toledo, oh"
        - "south bend, in"
        - "bloomington, in"
        - "minneapolis, mn"
        - "rochester / southeastern minnesota"
        - "rochester, mn"
        - "las vegas / summerlin, nv"
        - "las vegas, nv"
        - "henderson, nv"
        # Lansing and Kalamazoo added 2026-09-21 (Christopher, private event
        # rules for this brand: "If it's for the Lansing or Kalamazoo
        # great[er] city limits you don't answer the emails. Keep them in
        # Open and bonnie will send them to the local licensee to answer
        # themselves.") - same "runs its own local support" category as the
        # cities above, so folded into this existing rule rather than a
        # private-event-only one; this means it excludes ALL ticket types
        # from these two cities, not just private event requests, matching
        # how every other city in this list already works. Flag to
        # Christopher if he actually meant this scoped to private event
        # requests only.
        #
        # ASSUMPTION - could not confirm the real ticket wording live (lost
        # the Zendesk browser session while building this) - covering both
        # the plain "city, state" form and a "greater X" form, same as the
        # Las Vegas / Rochester entries above. Confirm against a real
        # Lansing/Kalamazoo ticket and adjust these phrases if the wording
        # differs, same as the other TODO on this rule.
        - "lansing, mi"
        - "lansing mi"
        - "greater lansing"
        - "east lansing"
        - "kalamazoo, mi"
        - "kalamazoo mi"
        - "greater kalamazoo"
        # The rest of the Greater Lansing / Mid Michigan territory
        # (Christopher, 2026-10-01). Until this list existed the rule only
        # caught "lansing, mi" and "greater lansing": 11 tickets had ever
        # been tagged out_of_scope_location while 96 mentioned Okemos and 14
        # mentioned Holt, so most of this licensee's area was being answered
        # by us instead of handed to them.
        #
        # QUALIFICATION MATTERS MORE HERE THAN ANYWHERE ELSE in this file. A
        # false positive on a market rule sends someone a clarifying question;
        # a false positive HERE makes us stop answering a real customer. The
        # form body carries the customer's own name, so bare "leslie",
        # "mason", "perry", "charlotte", "jackson", "holt" or "dewitt" would
        # silently refuse service to anyone called that, anywhere. "portland"
        # and "charlotte" also point at far better-known cities in Oregon and
        # North Carolina. All of those therefore require the state.
        - "okemos"
        - "owosso"
        - "williamston, mi"
        - "williamston mi"
        - "laingsburg"
        - "grand ledge"
        - "eaton rapids"
        - "holt, mi"
        - "holt mi"
        - "mason, mi"
        - "mason mi"
        - "dewitt, mi"
        - "dewitt mi"
        - "de witt, mi"
        - "portland, mi"
        - "portland mi"
        - "st. johns, mi"
        - "st. johns mi"
        - "st johns, mi"
        - "st johns mi"
        - "perry, mi"
        - "perry mi"
        - "leslie, mi"
        - "leslie mi"
        - "jackson, mi"
        - "jackson mi"
        - "charlotte, mi"
        - "charlotte mi"
    action: no_action
    force_human_review: false
    add_tags: ["out_of_scope_location"]

  - name: refund_or_cancellation_request
    match:
      any_keywords: ["refund", "cancel my", "cancellation", "money back", "chargeback"]
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "refund_request"]

  - name: angry_or_upset_customer
    match:
      any_keywords: ["unacceptable", "furious", "scam", "lawsuit", "terrible experience", "worst"]
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "upset_customer"]

  - name: licensee_recruitment_inquiry
    match:
      any_keywords: ["become a licensee", "open a franchise", "start my own", "how do i become", "territory"]
    action: no_action
    force_human_review: false
    add_tags: ["licensee_lead"]

  - name: groupon_or_promo_code
    match:
      any_keywords: ["groupon", "livingsocial", "living social", "voucher", "promo code", "discount code", "coupon"]
    action: no_action
    force_human_review: false
    add_tags: ["promo_code_question"]

  # The customer's ANSWER to a clarifying question we sent (focus and/or
  # location unknown - see src/private-event-clarifiers.ts). Matched by tag
  # for the same reason as private_event_reply_after_quote_sent below: the
  # reply is short ("it's a work thing, Indianapolis") and does not contain
  # the "Party Request from Wine & Canvas" contact-form phrase that
  # event_booking_question requires, so without this rule the answer we
  # just asked for would fall through to a generic FAQ rule and never reach
  # the quote branch at all.
  #
  # Routes to the same private_event_quote action, where the reply is
  # re-classified with the new information and either quoted properly or -
  # if it is STILL unclear - handed to a human rather than asked twice.
  # Christopher, 2026-09-25.
  - name: private_event_clarification_reply
    match:
      tags: ["private_event_clarification_sent"]
    action: private_event_quote
    force_human_review: false
    add_tags: ["booking_question"]

  - name: private_event_reply_after_quote_sent
    match:
      # Placed ahead of event_booking_question (and its new
      # required_keywords gate below) so a ticket already tagged
      # private_event_quote_sent still routes to the SAME
      # "private_event_quote" action on every later reprocess - the
      # idempotency guard at the top of that pipeline.ts branch is what
      # actually stops the quote from being re-sent, tagging the ticket
      # needs_human instead. Without this rule, a customer's short reply
      # ("thanks! quick question...") wouldn't contain the required
      # contact-form phrase below and would fall through to a generic FAQ
      # rule instead of that specific, better-tagged handling.
      tags: ["private_event_quote_sent"]
    action: private_event_quote
    force_human_review: false
    add_tags: ["booking_question"]

  - name: event_booking_question
    match:
      # "party request", "guests:", "preferred date" added 2026-09-13 after
      # ticket #28740 ("Party Request from Sarah Taylor") fell through to
      # general_faq unmatched - real Private Event inquiries come in via a
      # location's contact form as "Party Request from [Name]" with
      # structured Name/Email/Guests/Preferred Date/Location fields, not the
      # phrases below, so they need their own keywords.
      any_keywords: ["book an event", "book a class", "private event", "date availability", "how do i book", "party request", "guests:", "preferred date"]
      # required_keywords added 2026-09-23 per Christopher: "Wine and
      # Canvas can be Party Request from Wine & Canvas. That is in every
      # Private Event Inquiry subject line." Confirmed directly against
      # ticket #29199 (Rachael Nesbitt, genuine inquiry) - the phrase isn't
      # actually in the Zendesk-displayed SUBJECT (that's templated as
      # "Party Request from [Name]"), it's the fixed first line of the
      # contact form's own message body, present on every real submission
      # ("-- This e-mail was sent from a contact form on Wine & Canvas" is
      # the matching closing line). Made REQUIRED - not just another
      # any_keywords option - because the broad keyword list above is
      # exactly what let two real staff/licensee messages get auto-quoted
      # by mistake: #29225 (Kiara Kelly, "New Private event inquiry - are
      # you available - 10/24") and #29206 (Amanda Winden, "Re: Wine and
      # canvas Events", an unrelated website-bug thread CC'ing St. Julian
      # Winery). Unlike Painting and Vino, every genuine Wine and Canvas
      # private-event inquiry comes in through this one contact form - see
      # the note above - so gating on it here costs nothing on the
      # true-positive side. (There's also a separate,
      # sender-email-address-based guard in pipeline.ts,
      # isInternalBrandSender - this is a second, independent layer, not a
      # replacement for it.)
      required_keywords: ["party request from wine & canvas"]
    # Changed from "pending" (AI-drafted) to "private_event_quote"
    # 2026-09-21 (Christopher: "We need to now work on Wine and Canvas
    # private event requests. There are more rules for this brand.") - a
    # private event inquiry now gets a mechanical, non-AI quote instead of
    # an AI draft: src/private-event-quotes.ts classifies it into
    # corporate / fundraiser / kids / standard by keyword (NOT AI
    # classification, per Christopher's explicit instruction) and renders
    # the matching literal template, location-filtered to the one city the
    # inquiry is about. See the "private_event_quote" branch in
    # src/pipeline.ts. Stays held for human review (never auto-sent) until
    # PRIVATE_EVENT_QUOTES_LIVE=true is set - see src/config.ts.
    action: private_event_quote
    force_human_review: false
    add_tags: ["booking_question"]

  - name: event_sign_up_question
    match:
      any_keywords: ["how do i sign up", "signing up", "sign up for", "how do i register", "register for", "how do i attend", "looking for an event"]
    action: no_action
    force_human_review: false
    add_tags: ["faq_auto_answered", "booking_question"]

  - name: general_faq
    match:
      any_keywords: ["what is", "how does", "do you offer", "hours", "location", "price", "cost", "policy"]
    action: no_action
    force_human_review: false
    add_tags: ["faq_auto_answered"]

  - name: fallback_unclassified
    match: {}
    action: no_action
    force_human_review: false
    add_tags: ["needs_human", "unclassified"]
